name: Deploy to K3s

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/rental-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USER }}/rental-backend:latest

      - name: Deploy to K3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Mật khẩu (nếu dùng password thay vì SSH key)
          # password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Pull image mới nhất về server (để chắc chắn server lấy bản mới)
            docker pull ${{ secrets.DOCKER_USER }}/rental-backend:latest
            
            # Restart deployment trên Kubernetes (k3s) để apply image mới
            # Giả định file deployment.yaml đã được apply trên cluster từ trước
            kubectl rollout restart deployment backend
