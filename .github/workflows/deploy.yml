name: Deploy to K3s

on:
  push:
    branches:
      - main
      - nhi_branch

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          # Chuyển repository owner thành chữ thường (bắt buộc đối với GHCR)
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPO_LOWER/rental-backend:latest ./backend
          docker push ghcr.io/$REPO_LOWER/rental-backend:latest

      - name: Build and push frontend image
        run: |
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "VITE_API_URL=http://100.27.50.216:30080/api/v1" > frontend/.env
          docker build -t ghcr.io/$REPO_LOWER/rental-frontend:latest ./frontend
          docker push ghcr.io/$REPO_LOWER/rental-frontend:latest

      - name: Copy K8s manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          source: "k8s/"
          target: "~/"

      - name: Deploy to K3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Tạo secret cho backend từ GitHub Secrets
            cat << 'EOF' > ./k8s/.env
            ${{ secrets.ENV_FILE }}
            EOF
            sudo kubectl create secret generic backend-secrets --from-env-file=./k8s/.env --dry-run=client -o yaml | sudo kubectl apply -f -
            rm ./k8s/.env
            
            # K3s sử dụng containerd thay vì docker, và có file k3s.yaml phân quyền root
            sudo kubectl apply -f ./k8s/
            sudo kubectl rollout restart deployment backend || true
            sudo kubectl rollout restart deployment frontend || true
            
            # Đợi một chút để pod khởi động
            sleep 15
            
            echo "=== POD STATUS ==="
            sudo kubectl get pods
            
            echo "=== BACKEND LOGS ==="
            sudo kubectl logs -l app=backend --tail=100 || true
