name: Deploy to K3s

on:
  push:
    branches:
      - main
      - nhi_branch

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          # Chuyển repository owner thành chữ thường (bắt buộc đối với GHCR)
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPO_LOWER/rental-backend:latest ./backend
          docker push ghcr.io/$REPO_LOWER/rental-backend:latest

      - name: Deploy to K3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Mật khẩu (nếu dùng password thay vì SSH key)
          # password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Pull image mới nhất về server
            REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            docker pull ghcr.io/$REPO_LOWER/rental-backend:latest
            
            # Restart deployment trên Kubernetes
            kubectl rollout restart deployment backend
