openapi: 3.0.3
info:
  title: Rental Management Platform API
  description: >
    REST API for a room rental platform supporting owners, renters, and admins.
    Real-time messaging is delivered via WebSocket (STOMP over SockJS) at `ws://localhost:8080/ws`.
  version: "1.0.0"

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Auth
  - name: Users
  - name: Rooms
  - name: Room Images
  - name: Posts
  - name: Payments
  - name: Contracts
  - name: Bills
  - name: Conversations
  - name: Favorites
  - name: Reviews
  - name: Reports
  - name: Vehicles
  - name: Notifications
  - name: Public
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true

    PaginatedMeta:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        last:
          type: boolean

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        username:
          type: string
        fullName:
          type: string
        phone:
          type: string
        citizenId:
          type: string
        permanentAddress:
          type: string
        avatarUrl:
          type: string
        bankCode:
          type: string
        bankAccountNumber:
          type: string
        bankAccountName:
          type: string
        role:
          type: string
          enum: [OWNER, RENTER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, BANNED, PENDING]
        createdAt:
          type: string
          format: date-time

    Room:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        price:
          type: integer
          format: int64
        areaMq:
          type: number
          format: double
        roomType:
          type: string
          enum: [ROOM, APARTMENT, STUDIO, HOUSE]
        address:
          type: string
        ward:
          type: string
        district:
          type: string
        city:
          type: string
        hasAc:
          type: boolean
        hasFridge:
          type: boolean
        hasPrivateWc:
          type: boolean
        hasSecurity:
          type: boolean
        wifiFee:
          type: integer
          format: int64
        waterPricePerUnit:
          type: integer
          format: int64
        electricityPricePerUnit:
          type: integer
          format: int64
        serviceFee:
          type: integer
          format: int64
        bikeParkingFee:
          type: integer
          format: int64
        deposit:
          type: integer
          format: int64
        rentalStatus:
          type: string
          enum: [AVAILABLE, OCCUPIED, MAINTENANCE]
        avgRating:
          type: number
          format: double
        reviewCount:
          type: integer
        images:
          type: array
          items:
            $ref: '#/components/schemas/RoomImage'
        createdAt:
          type: string
          format: date-time

    RoomImage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        imageUrl:
          type: string
        isThumbnail:
          type: boolean
        displayOrder:
          type: integer

    Post:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, ACTIVE, EXPIRED]
        durationType:
          type: string
          enum: [DAY, WEEK, MONTH, QUARTER, YEAR]
        durationValue:
          type: integer
        listingFee:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        rejectReason:
          type: string
          nullable: true
        viewCount:
          type: integer
        favoriteCount:
          type: integer
        room:
          $ref: '#/components/schemas/Room'
        createdAt:
          type: string
          format: date-time

    Contract:
      type: object
      properties:
        id:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        monthlyRent:
          type: integer
          format: int64
        electricityPrice:
          type: integer
          format: int64
        waterPrice:
          type: integer
          format: int64
        status:
          type: string
          enum: [ACTIVE, SIGNED, ENDED]
        room:
          $ref: '#/components/schemas/Room'
        createdAt:
          type: string
          format: date-time

    Bill:
      type: object
      properties:
        id:
          type: integer
          format: int64
        billingMonth:
          type: string
          example: "2025-07"
        elecPrev:
          type: integer
        elecCurr:
          type: integer
        elecUsage:
          type: integer
        elecUnitPrice:
          type: integer
          format: int64
        elecAmount:
          type: integer
          format: int64
        waterPrev:
          type: integer
        waterCurr:
          type: integer
        waterUsage:
          type: integer
        waterUnitPrice:
          type: integer
          format: int64
        waterAmount:
          type: integer
          format: int64
        rentAmount:
          type: integer
          format: int64
        serviceFee:
          type: integer
          format: int64
        wifiFee:
          type: integer
          format: int64
        bikeParkingFee:
          type: integer
          format: int64
        extraFee:
          type: integer
          format: int64
        extraNote:
          type: string
          nullable: true
        totalAmount:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, PAID, OVERDUE]
        paymentProofUrl:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, PAID, FAILED]
        note:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        messageText:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Conversation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        otherUser:
          $ref: '#/components/schemas/User'
        lastMessage:
          $ref: '#/components/schemas/Message'
        unreadCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        id:
          type: integer
          format: int64
        reviewType:
          type: string
          enum: [ROOM, RENTER]
        ratingScore:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        reviewer:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time

    Report:
      type: object
      properties:
        id:
          type: integer
          format: int64
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, RESOLVED, REJECTED]
        reporter:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time

    Vehicle:
      type: object
      properties:
        id:
          type: integer
          format: int64
        licensePlate:
          type: string
        vehicleType:
          type: string
          enum: [MOTORBIKE, CAR, BICYCLE]
        imageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - CONTRACT_SIGNED
            - CONTRACT_ENDED
            - BILL_CREATED
            - BILL_PAID
            - PAYMENT_PROOF_SUBMITTED
            - PAYMENT_PROOF_APPROVED
            - PAYMENT_PROOF_REJECTED
            - POST_APPROVED
            - POST_REJECTED
            - REVIEW_APPROVED
            - REPORT_RESOLVED
            - NEW_MESSAGE
        title:
          type: string
        message:
          type: string
        relatedEntityId:
          type: integer
          format: int64
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

paths:

  # ─── AUTH ────────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName, phone, role]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                fullName:
                  type: string
                phone:
                  type: string
                role:
                  type: string
                  enum: [OWNER, RENTER]
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          user:
                            $ref: '#/components/schemas/User'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Blacklist the current JWT token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using the token from email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ─── USERS ───────────────────────────────────────────────────────────────────

  /users/me:
    get:
      tags: [Users]
      summary: Get authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
    put:
      tags: [Users]
      summary: Update authenticated user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phone:
                  type: string
                citizenId:
                  type: string
                permanentAddress:
                  type: string
                bankCode:
                  type: string
                bankAccountNumber:
                  type: string
                bankAccountName:
                  type: string
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Upload user avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          avatarUrl:
                            type: string

  /users/me/favorites:
    get:
      tags: [Favorites]
      summary: Get authenticated user's favorite posts
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated favorite posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/me/reviews:
    get:
      tags: [Reviews]
      summary: Get reviews written by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/me/renter-reviews:
    get:
      tags: [Reviews]
      summary: Get reviews written about the authenticated renter
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated renter reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/me/reports:
    get:
      tags: [Reports]
      summary: Get reports submitted by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/search:
    get:
      tags: [Users]
      summary: Search users by keyword (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/lookup-renter:
    get:
      tags: [Users]
      summary: Find a renter by exact email (Owner/Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Renter found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /users:
    get:
      tags: [Users]
      summary: List all users with filters (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [OWNER, RENTER, ADMIN]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, BANNED, PENDING]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/{userId}/status:
    patch:
      tags: [Users]
      summary: Update user status (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, BANNED, PENDING]
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /users/{userId}/renter-reviews:
    get:
      tags: [Reviews]
      summary: Get reviews about a renter (Owner/Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated renter reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ─── ROOMS ───────────────────────────────────────────────────────────────────

  /rooms:
    get:
      tags: [Rooms]
      summary: List owner's rooms
      security:
        - bearerAuth: []
      parameters:
        - name: rentalStatus
          in: query
          schema:
            type: string
            enum: [AVAILABLE, OCCUPIED, MAINTENANCE]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated rooms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Rooms]
      summary: Create a new room
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, price, areaMq, roomType, address, ward, district, city]
              properties:
                title:
                  type: string
                description:
                  type: string
                price:
                  type: integer
                  format: int64
                areaMq:
                  type: number
                  format: double
                roomType:
                  type: string
                  enum: [ROOM, APARTMENT, STUDIO, HOUSE]
                address:
                  type: string
                ward:
                  type: string
                district:
                  type: string
                city:
                  type: string
                hasAc:
                  type: boolean
                hasFridge:
                  type: boolean
                hasPrivateWc:
                  type: boolean
                hasSecurity:
                  type: boolean
                wifiFee:
                  type: integer
                  format: int64
                waterPricePerUnit:
                  type: integer
                  format: int64
                electricityPricePerUnit:
                  type: integer
                  format: int64
                serviceFee:
                  type: integer
                  format: int64
                bikeParkingFee:
                  type: integer
                  format: int64
                deposit:
                  type: integer
                  format: int64
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Room'

  /rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Rooms]
      summary: Get room details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Room'
    put:
      tags: [Rooms]
      summary: Update a room
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Room'
      responses:
        "200":
          description: Room updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Room'
    delete:
      tags: [Rooms]
      summary: Delete a room
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Room deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /rooms/{roomId}/rental-status:
    patch:
      tags: [Rooms]
      summary: Update room rental status
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rentalStatus]
              properties:
                rentalStatus:
                  type: string
                  enum: [AVAILABLE, OCCUPIED, MAINTENANCE]
      responses:
        "200":
          description: Rental status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Room'

  # ─── ROOM IMAGES ─────────────────────────────────────────────────────────────

  /rooms/{roomId}/images:
    post:
      tags: [Room Images]
      summary: Upload a room image
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
