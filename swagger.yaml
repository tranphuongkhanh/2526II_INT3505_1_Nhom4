  /reviews:
    get:
      tags: [Reviews]
      summary: Browse the public reviews feed
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [ROOM, RENTER]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated approved reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /rooms/{roomId}/reviews:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Reviews]
      summary: Get approved reviews for a room
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated room reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Reviews]
      summary: Submit a room review (Renter, requires completed contract)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractId, ratingScore, comment]
              properties:
                contractId:
                  type: integer
                  format: int64
                ratingScore:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        "201":
          description: Review submitted (pending approval)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Review'

  /reviews/{reviewId}:
    patch:
      tags: [Reviews]
      summary: Edit a review (resets to pending)
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ratingScore:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        "200":
          description: Review updated (status reset to PENDING)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Review'

  # ─── VEHICLES ────────────────────────────────────────────────────────────────

  /rooms/{roomId}/vehicles:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Vehicles]
      summary: List vehicles registered in a room
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Vehicle'
    post:
      tags: [Vehicles]
      summary: Register a vehicle (Renter)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [licensePlate, vehicleType]
              properties:
                licensePlate:
                  type: string
                vehicleType:
                  type: string
                  enum: [MOTORBIKE, CAR, BICYCLE]
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Vehicle registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Vehicle'

  /vehicles/{vehicleId}:
    delete:
      tags: [Vehicles]
      summary: Delete a vehicle registration
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Vehicle deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

