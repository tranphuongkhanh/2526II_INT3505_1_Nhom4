# ?? Server ??????????????????????????????????????????
server.port=8080
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ?? PostgreSQL Neon Tech ?????????????????????????????
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}&channelBinding=${DB_CHANNEL_BINDING:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate ??????????????????????????????????
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ?? JWT ??????????????????????????????????????????????
# Prefer env var JWT_SECRET but fall back to a dev default to avoid startup failure in IntelliJ.
# IMPORTANT: override JWT_SECRET in real environments.
jwt.secret=${JWT_SECRET:dev_jwt_secret_change_me_change_me_change_me_32bytes}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ?? Email (Gmail SMTP) ???????????????????????????????????????
# Provide empty defaults so local dev can start without mail creds.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ?? App config ????????????????????????????????????????????????
app.frontend.url=http://localhost:5173
app.reset-token.expiration-minutes=30
